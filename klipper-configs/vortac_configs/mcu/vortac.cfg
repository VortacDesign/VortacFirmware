[mcu vortac]
canbus_uuid: 70d72bfb79f1

[stepper_x]
endstop_pin: vortac:PA7

[stepper_z]
endstop_pin: probe:z_virtual_endstop

[probe]
pin: vortac:PA6
x_offset: 0
y_offset: 33.8
z_offset: 3
samples: 2
samples_result: median
speed: 5.0

[neopixel my_neopixel]
pin: vortac:PA4
chain_count: 2
color_order: GRB  # Default
initial_RED: 0.1      # 255/255
initial_GREEN: 0.1   # 192/255 ≈ 0.75
initial_BLUE: 0.7     # 203/255 ≈ 0.8

[manual_stepper grabber]
step_pin: vortac:PA3
dir_pin: vortac:PA1
enable_pin: !vortac:PA0
full_steps_per_rotation: 64
microsteps: 1
gear_ratio: 96:1 #1/64 * 30/20
rotation_distance: 720

[tmc2209 manual_stepper grabber]
uart_pin: vortac:PA2
run_current: 0.6
hold_current: 0.02
sense_resistor: 0.068
stealthchop_threshold: 500

[angle my_angle_sensor]
sensor_type: as5047d
stepper: manual_stepper grabber
cs_pin: vortac:PB12
#spi_speed:
#spi_bus:
spi_software_sclk_pin: vortac:PB13
spi_software_miso_pin: vortac:PB14
spi_software_mosi_pin: vortac:PB15

[vortac_grabber]
angleSensor: my_angle_sensor
sample_count: 32
zero_pos_offset: -51
tool_doc_test_code: 
  {% set x = vortac_grabber.params_x_doc_pos|float %}
  {% set y = vortac_grabber.params_y_doc_pos|float %}
  {% set z = vortac_grabber.params_z_doc_pos|float %}
  ; Nun die Move-Command zum gespeicherten Punkt
  G1 X{x} Y{y+50} Z{z} F2000

tool_doc_load: 
  {% set x = vortac_grabber.params_x_doc_pos|float %}
  {% set y = vortac_grabber.params_y_doc_pos|float %}
  {% set z = vortac_grabber.params_z_doc_pos|float %}
  ; Nun die Move-Command zum gespeicherten Punkt
  ;first disengage Vortac key
  VORTAC_MOVE TARGET=0
  ;move in front of docking position z-5 for load
  G1 X{x} Y{y+50} Z{z-5} F2000 
  ;move towards docking position
  G1 Y{y} F500
  VORTAC_MOVE TARGET=120
  ;lift toolhead
  G1 Z{z} F500
  ;move back
  G1 Y{y+50} F500

tool_doc_unload: 
  {% set x = vortac_grabber.params_x_doc_pos|float %}
  {% set y = vortac_grabber.params_y_doc_pos|float %}
  {% set z = vortac_grabber.params_z_doc_pos|float %}
  ; Nun die Move-Command zum gespeicherten Punkt
  ;move in front of docking position z for unload
  G1 X{x} Y{y+50} Z{z} F2000 
  ;move towards docking position
  G1 Y{y} F500
  ;move in front of docking position z -5 for unload
  G1 Z{z-5} F500
  ;this disengages the key
  VORTAC_MOVE TARGET=0
  ;move back
  G1 Y{y+50} F500
  
    