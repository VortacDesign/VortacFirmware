# This file contains common pin mappings for the BigTreeTech Octopus
# (non-Pro) boards.

# Important! Do not use this config with an Octopus Pro v1.1 board as
# doing so could result in a heater being inadvertently enabled.

# To use this config, start by identifying the micro-controller on the
# board - it may be an STM32F446, or STM32F429.  Select the
# appropriate micro-controller in "make menuconfig" and select "Enable
# low-level configuration options". For STM32F446 boards the firmware
# should be compiled with a "32KiB bootloader" and a "12MHz crystal"
# clock reference. For STM32F429 boards use a "32KiB bootloader" and
# an "8MHz crystal".

# See docs/Config_Reference.md for a description of parameters.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_1E0011000A50534841313020-if00
restart_method: command
# CAN bus is also available on this board

[printer]
kinematics: corexy
max_velocity: 500  
# max_accel: 3000    			#Max 4000
max_accel: 3000 # 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 50 			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 400
square_corner_velocity: 2.0

########################################
# Stepper Configuration
########################################

[stepper_x]
##	Connected to X on mcu_xye (B Motor)
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2209_stepper_x:virtual_endstop #TODO Change to Physical Endstop pin remove Jumper on Mainboard
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 70   #Max 100
second_homing_speed: 40
homing_retract_dist: 6
homing_positive_dir: true

[stepper_y]
##	Connected to Y on mcu_xye (A Motor)
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
endstop_pin: PG10
#endstop_pin: vortac:PA7
position_min: 0
position_endstop: 305
position_max: 305
homing_speed: 70   #Max 100
second_homing_speed: 40
homing_retract_dist: 5
homing_positive_dir: true


##	Z1 Stepper - Front Left
[stepper_z]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop

##--------------------------------------------------------------------

##	Uncomment below for 250mm build
#position_max: 240

##	Uncomment below for 300mm build
position_max: 255

##	Uncomment below for 350mm build
#position_max: 340

##--------------------------------------------------------------------

position_min: -5
homing_speed: 8
homing_retract_speed: 2
second_homing_speed: 4
homing_retract_dist: 3

##	Z1 Stepper - Rear Left
[stepper_z1]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16


##	Z2 Stepper - Rear Right
[stepper_z2]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Z3 Stepper - Front Right
[stepper_z3]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16


