# tools.example.cfg — template for tools.cfg (Vortac tool registry + manager).
#
# tools.cfg is user-specific (which tools are online, how many docks) and
# therefore gitignored. Copy this file to tools.cfg in the same directory and
# adjust it. Klipper never reads .example files.
#
# Include tools.cfg from printer.cfg after the grabber is set up:
#
#     [include vortac_configs/mcu/vortac.cfg]    # grabber MCU + [vortac_grabber]
#     [include vortac_configs/tools.cfg]         # this file
#
# Add per-tool files to the includes below as you bring tools online. Start
# from tools/tool0.example.cfg (copy, rename to your tool's name, edit).
#
# TOOL NUMBERING = INCLUDE ORDER: the first (uncommented) tool include is
# T0, the next T1, and so on. Commenting a tool out renumbers the ones
# after it — the first tool always owns Klipper's primary [extruder] and
# [fan]. The physical dock of each tool is set in its file (home_dock
# override) and does NOT renumber. Saved dock calibration of a
# commented-out tool survives in printer.cfg's autosave block.

[include tools/myTool.cfg]
# [include tools/myOtherTool.cfg]


# Dock ARGB channel roles (per dock LED):
#   R = supply gate for the parked tool board. INVERTED: R HIGH cuts the
#       supply, R 0.0 = powered. That polarity is mandatory — klippy connects
#       every tool mcu BEFORE it ever programs this LED, so "no LED data yet"
#       has to mean "tool powered", or klippy could never start.
#   G = pulls the dock_sense pad active low — sense logic only works while
#       this channel is ON; outside the detection strobe ALL docks keep it on
#   B = status LED, content selected by argb_status_mode
[vortac_manager]
dock_count:         1
argb_led:           dockController  # neopixel chain on mainboard
argb_channel:       green           # sense-pull channel (active low pad)
argb_status_channel: blue           # status LED (see argb_status_mode)
dock_strobe_time:   0.10            # seconds to wait after each strobe change
#auto_detect:       True            # run VORTAC_DETECT automatically at startup
#auto_detect_delay: 3.0             # seconds after klippy:ready before it runs

# --- status LED (blue) ------------------------------------------------------
# sense    : mirrors the sense pull — strobes along during VORTAC_DETECT
# power    : lit while the dock feeds its tool board (inverse of red)
# detected : full = tool detected here, dim = confirmed empty,
#            off = dock map not trustworthy (stale / ambiguous)
argb_status_mode:   sense
#argb_status_dim:   0.15            # brightness of the "confirmed empty" level

# --- dock power (dark power management) -------------------------------------
# The pogo contact is made and broken by the Y slide at the dock (the
# spring-loaded dock board rides along through the whole Z travel). The dock
# supply must never be switched ON into pogos already mated to the grabber-fed
# tool (trips the dock fuse); switching OFF into mated pogos is fine:
#   park  : approach -> power ON (pogos separated) -> slide in -> drop
#           -> disengage
#   fetch : engage -> lift -> verify grab_sense -> power OFF -> slide out
# The tool board is always fed from the other side while the dock switches.
#
#   off       : never touch the supply gate
#   occupancy : de-energize docks positively known to be empty
#   handover  : additionally cut the supply before the fetch backout so the
#               pogos separate dead (needs the grabber to feed the held tool)
dock_power_mode:    handover
#dock_power_channel: red            # supply gate channel
#dock_power_invert: True            # channel HIGH cuts the supply (Vortac hw)
#dock_power_settle: 0.25            # seconds after energizing before moving on
#dock_power_watchdog: 5.0           # revert manual SET_LED supply tampering
                                    # within this many seconds (0 disables)
#dock_seat_press:   0.5             # mm overtravel below the hooked Z to
                                    # press the hooks into their seat (0 = off)

# --- dock routine (approach / slide / checked hook-in & unhook) --------------
# All values below are the built-in defaults — uncomment to change. Feedrates
# are mm/min (they go straight into the G1 F word). The saved dock position is
# the hooked/engage position; every distance here is relative to it.
#dock_y_safe:       50.0            # mm Y clearance in front of the dock
#dock_z_clearance:  5.0             # mm lift above the hooked Z
#dock_approach_hop: 5.0             # mm relative Z hop before the Y/X travel
#dock_approach_feedrate: 2000       # mm/min travel to the dock front
#dock_slide_feedrate: 400           # mm/min Y slide in/out
#dock_lift_feedrate: 40             # mm/min checked Z drop/lift at the dock
#dock_backout_feedrate: 40          # mm/min checked Y backout steps
#
# Checked (stepwise) hook-in / unhook: after every step the motion queue is
# drained and dock_sense/grab_sense are evaluated, which is why load/unload
# move in visible steps.
#dock_check_zstep:  1.0             # mm per checked Z step
#dock_check_ystep:  2.0             # mm per checked Y backout step — must
                                    # exceed the Y extent of the landing pad
#dock_check_steps:  1               # number of checked backout steps
#dock_retries:      3               # re-seat + retry attempts before aborting
#dock_contact_settle: 1.0           # s to wait for dock_sense after the press
#sense_settle:      0.10            # s pause after each checked step before
                                    # the sense pins are read (defaults to
                                    # dock_strobe_time)

# --- leaving the dock area --------------------------------------------------
# Every dock routine ends on the safe line, dock_y_safe in front of its dock,
# at the clearance height. retreat_z then drops the carriage straight back
# down — the exact mirror of the approach, which raises Z last once X and Y
# are already on the dock.
#
# That one move is the whole retreat: the docks sit at the top of the Z
# travel, so below them the dock row is out of the plane of motion and the
# next travel can go anywhere. No X/Y safe position is needed — the dock
# routine already ends clear of every tool.
#
# Defaults to 150 mm, so this works without configuring anything. Check it
# against your own geometry: it must clear the docks on the way down and the
# tallest print you run on the way across.
#retreat_z:         150.0           # drop out of the dock plane after a change

# For per-tool tweaks, set tool_activate_gcode / tool_deactivate_gcode
# via include_with overrides (vortac_tool TN....) — those run on either side
# of the dock motion.
