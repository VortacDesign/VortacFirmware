
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_1E0011000A50534841313020-if00
restart_method: command

[neopixel docktest]
pin: PB6
color_order: RGB
chain_count: 5

# [output_pin testpin]
# pin: PB0
# value: 0

[printer]
kinematics: corexy
max_velocity: 600  
max_accel: 5000 # 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 50
max_z_accel: 400
square_corner_velocity: 2.0

########################################
# Stepper Configuration
########################################

[stepper_x]
##	Connected to X on mcu_xye (B Motor)
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
position_min: -2
position_endstop: 302
position_max: 302
homing_speed: 80   #Max 100
second_homing_speed: 40
homing_retract_dist: 6
homing_positive_dir: true

[stepper_y]
##	Connected to Y on mcu_xye (A Motor)
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:400 
position_min: -2
position_endstop: 307
position_max: 307
homing_speed: 80   #Max 100
second_homing_speed: 40
homing_retract_dist: 5
homing_positive_dir: true


##	Z1 Stepper - Front Left
[stepper_z]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
position_min: -5
homing_speed: 20
homing_retract_speed: 2
second_homing_speed: 4
homing_retract_dist: 3

##	Z1 Stepper - Rear Left
[stepper_z1]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16


##	Z2 Stepper - Rear Right
[stepper_z2]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Z3 Stepper - Front Right
[stepper_z3]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16


