########################################
# Calibration Configuration
########################################


[bed_mesh]
speed: 200
horizontal_move_z: 4
mesh_min: 10, 40
mesh_max: 290, 250
probe_count: 3, 3
fade_start: 1
fade_end: 10
fade_target: 0


[quad_gantry_level]
speed: 200
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.02
max_adjust: 10
gantry_corners:
	-60,-40.8
	360, 329.4
    
points:
	30,0
	30,220
	270,220
	270,0

#--------------------------------------------------------------------


[heater_bed]
heater_pin: PA1     
sensor_type: Generic 3950            
sensor_pin: PF3                  
min_temp: 0
max_temp: 130
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

[controller_fan skirt_intake]
pin: PE5
max_power:1.0
cycle_time: 0.003
kick_start_time: 0.2
fan_speed: 0.8
idle_timeout:300
heater:heater_bed

[controller_fan skirt_exhaust]
pin: PD12
max_power: 1.0
cycle_time: 0.003
kick_start_time: 0.2
fan_speed: 0.8
idle_timeout:300
heater:heater_bed

