########################################
# TMC2209 configuration || Make sure to update below for your relevant driver (2208 or 2209)
########################################


[tmc2209 stepper_x]
uart_pin: PE4
interpolate: True
run_current: 1
sense_resistor: 0.110
#diag_pin: ^PG13     # use the same pin that was previously the endstop_pin! see sensorless homeing
#driver_SGTHRS: 100  # 255 is most sensitive value, 0 is least sensitive for sensorless homeing
#stealthchop_threshold: 300

[tmc2209 stepper_y]
uart_pin: PF2
interpolate: True
run_current: 1
sense_resistor: 0.110
#stealthchop_threshold: 300

[tmc2209 stepper_z]
uart_pin: PC4
interpolate: true
run_current: 0.8
sense_resistor: 0.110
diag_pin:PG6
driver_SGTHRS:60
#stealthchop_threshold: 9999

[tmc2209 stepper_z1]
uart_pin: PD11
interpolate: true
run_current: 0.8
sense_resistor: 0.110
diag_pin:PG9
driver_SGTHRS:60
#stealthchop_threshold: 9999

[tmc2209 stepper_z2]
uart_pin: PC6
interpolate: true
run_current: 0.8
sense_resistor: 0.110
diag_pin:PG10
driver_SGTHRS:60
#stealthchop_threshold: 9999

[tmc2209 stepper_z3]
uart_pin: PC7
interpolate: true
run_current: 0.8
sense_resistor: 0.110
diag_pin:PG11
driver_SGTHRS:60
#stealthchop_threshold: 9999

# [safe_z_home]
# home_xy_position: 150, 150
# speed: 50
# z_hop: 5
# z_hop_speed: 5


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

