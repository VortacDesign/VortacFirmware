# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBCan]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 73d169988077


# Logical tool section. "TN" is a placeholder — include_with renames it to
# the namespace ([vortac_tool <namespace>]) and auto-injects tool_index
# (from include order in tools.cfg), mcu_name, canbus_uuid and
# extruder_name. Docks are established at runtime by VORTAC_DETECT; an
# optional manual fallback can be pinned via include_with overrides
# (`vortac_tool TN.home_dock: dockX`).
[vortac_tool TN]
dock_sense_pin:    !EBBCan:PB15       # dock Tool_id active state after opto logic
grab_sense_pin:    EBBCan:PB6         # default HIGH; pulled LOW by grabber


[adxl345]
cs_pin: EBBCan: PB12
spi_software_sclk_pin: EBBCan: PB10
spi_software_mosi_pin: EBBCan: PB11
spi_software_miso_pin: EBBCan: PB2
axes_map: z,-y,x

[resonance_tester]
probe_points: 100, 100, 20
accel_chip: adxl345

[input_shaper]
shaper_freq_x:57.8
shaper_type_x:mzv
shaper_freq_y:46.0
shaper_type_y:mzv

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2
max_freq: 200
dpi: 300

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
rotation_distance: 21.95
gear_ratio:50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: EBBCan: PA3
control: pid
pid_Kp:18.203
pid_Ki:4.283
pid_Kd:19.341
min_temp: 0
max_temp: 250
sensor_type: MAX31865
sensor_pin: EBBCan: PA4
spi_software_sclk_pin: EBBCan: PA5
spi_software_mosi_pin: EBBCan: PA7
spi_software_miso_pin: EBBCan: PA6
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
rtd_use_50Hz_filter: True
max_extrude_cross_section: 3



[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.5
sense_resistor: 0.110
interpolate: False

# [tmc2240 extruder]
# cs_pin: EBBCan: PA15
# spi_software_sclk_pin: EBBCan: PB10
# spi_software_mosi_pin: EBBCan: PB11
# spi_software_miso_pin: EBBCan: PB2
# driver_TPFD: 0
# run_current: 0.650
# stealthchop_threshold: 999999

[fan]
pin: EBBCan:PA1

[heater_fan hotend_fan]
pin: EBBCan:PA0
heater: extruder
heater_temp: 50.0

#[heater_fan 4W_FAN0]
#pin: EBBCan: PB14
#tachometer_pin: EBBCan: PB15
#tachometer_ppr: 1

[neopixel hotend_rgb]
pin: EBBCan:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.1      # 255/255
initial_GREEN: 0.1   # 192/255 ≈ 0.75
initial_BLUE: 0.7     # 203/255 ≈ 0.8
initial_WHITE: 0.0

