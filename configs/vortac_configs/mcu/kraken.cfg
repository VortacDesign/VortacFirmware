# This file contains common pin mappings for the BIGTREETECH Kraken.
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)" or "CAN bus (on PD0/PD1)".

# See docs/Config_Reference.md for a description of parameters.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_420027001351313230353039-if00 #consider moving ports and ids to printer.cfg

[neopixel dockController]
pin: PF12
chain_count: 5
color_order: GRB


[printer]
kinematics: corexy
max_velocity: 500  
max_accel: 10000
minimum_cruise_ratio: 0.5
max_z_velocity: 100
max_z_accel: 200
square_corner_velocity: 2.0

#--------------------------------------------------------------------------------------------
# Wird fuer den Z-Hop bei ungehomter Z-Achse im homing_override gebraucht
# (SET_KINEMATIC_POSITION). Falls die printer.cfg diese Sektion schon hat,
# hier entfernen -- Klipper erlaubt sie nur einmal.
[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 1.0
#--------------------------------------------------------------------------------------------

[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # --- Sicherheits-Z-Hop vor allem anderen ---------------------------------
  # Vor der ersten X/Y-Bewegung das Gantry vom Werkstueck loesen. Uebersprungen,
  # wenn die Duese ohnehin schon oben in der Parkebene steht (>= hoechstes
  # dock_z - 150, also auf/ueber retreat_z) -- dort ist der Weg frei.
  # Bei ungehomter Z-Achse ist die Hoehe unbekannt -> es wird immer gehopt
  # (SET_KINEMATIC_POSITION braucht [force_move] enable_force_move: True).
  {% set th = printer.toolhead %}
  {% set Z_HOP = 15.0 %}

  {% set dock_z = [] %}
  {% if 'vortac_manager' in printer %}
    {% for t in printer.vortac_manager.tools %}
      {% set obj = 'vortac_tool ' ~ t %}
      {% if obj in printer %}
        {% for d in printer[obj].dock_positions.values() %}
          {% if 'z' in d %}{% set _ = dock_z.append(d['z']|float) %}{% endif %}
        {% endfor %}
      {% endif %}
    {% endfor %}
  {% endif %}
  {% set park_z = (dock_z|max if dock_z else th.axis_maximum.z|float) - 150.0 %}

  {% set z_homed = 'z' in th.homed_axes %}
  {% set z_now   = th.position.z|float %}

  {% if not z_homed or z_now < park_z %}
    {% if z_homed %}
      {% set hop = [Z_HOP, th.axis_maximum.z|float - z_now]|min %}
    {% else %}
      SET_KINEMATIC_POSITION Z=0
      {% set hop = Z_HOP %}
    {% endif %}
    {% if hop > 0.05 %}
      G91
      G0 Z{hop} F1500
      G90
      M400
    {% endif %}
    {% if not z_homed %}
      SET_KINEMATIC_POSITION CLEAR=Z   ; Fake-Position wieder als ungehomed markieren
    {% endif %}
  {% endif %}

  # --- Y zuerst ---
  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}

  # --- dann X ---
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}

  # --- Z: in die Mitte fahren, Strom senken, oben homen ---
  {% if home_all or 'Z' in params %}
    {% set HOME_CUR = 0.6 %}
    {% set RUN_CUR  = printer.configfile.settings['tmc5160 stepper_z'].run_current %}

    # Falls nur G28 Z aufgerufen wurde und X/Y noch nicht gehomed sind:
    {% if 'x' not in printer.toolhead.homed_axes %}
      G28 Y
      G28 X
    {% endif %}

    G90
    G0 X150 Y130 F9000          ; Mitte

    SET_TMC_CURRENT STEPPER=stepper_z  CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT={HOME_CUR}
    G4 P800                      ; Stromwechsel + StallGuard beruhigen lassen

    G28 Z                        ; sensorless an der Decke, alle 4 einzeln

    G90
    G0 Z355 F1500                ; 10 mm vom Anschlag lösen

    SET_TMC_CURRENT STEPPER=stepper_z  CURRENT={RUN_CUR}
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={RUN_CUR}
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={RUN_CUR}
    SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT={RUN_CUR}
  {% endif %}

[quad_gantry_level]
speed: 500
horizontal_move_z: 6
max_adjust: 10
retries: 8
retry_tolerance: 0.02 #0.005 #0.0075
gantry_corners: -55,-23 #-40.8 #-70,-30.8 #-60,-10
  	            362,343.5 #340 #370,350 #360,370
		
points: 30,0
	    30,220
	    270,220
	    270,0

[bed_mesh]
speed: 500
horizontal_move_z: 6
mesh_min: 10, 40
mesh_max: 290, 250
probe_count: 4, 4

#--------------------------------------------------------------------------------------------

[stepper_x] #[B1 L]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE0

full_steps_per_rotation:400
rotation_distance: 40
microsteps: 32
position_min: -2
position_max: 302
position_endstop: 302
homing_speed: 70
second_homing_speed: 40
homing_retract_dist: 6
homing_positive_dir: true

[stepper_y] #[A1 R]
step_pin: PE5
dir_pin: PE4
enable_pin: !PE3
endstop_pin: PC15

full_steps_per_rotation:400
rotation_distance: 40
microsteps: 32
position_min: -2
position_max: 307
position_endstop: 307
homing_speed: 70
second_homing_speed: 40
homing_retract_dist: 6
homing_positive_dir: true


[tmc5160 stepper_x] #[A1 R]
cs_pin: PD4
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: false

run_current: 0.800
sense_resistor: 0.022
stealthchop_threshold: 0

[tmc5160 stepper_y] #[A1 R]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: false

run_current: 0.800
sense_resistor: 0.022
stealthchop_threshold: 0

#--------------------------------------------------------------------------------------------

[stepper_z] #[Z3 LF]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5

endstop_pin: tmc5160_stepper_z:virtual_endstop

gear_ratio: 80:16
full_steps_per_rotation:200
rotation_distance: 40
microsteps: 32
position_min: -2
position_max: 368
position_endstop: 368
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3
homing_positive_dir: true
homing_retract_dist: 0

[stepper_z1] #[Z4 LB]
step_pin: PG15
dir_pin: !PB6
enable_pin: !PG14

endstop_pin: tmc5160_stepper_z1:virtual_endstop

gear_ratio: 80:16
full_steps_per_rotation:200
rotation_distance: 40
microsteps: 32

[stepper_z2] #[Z1 RB]
step_pin: PG9
dir_pin: PG10
enable_pin: !PG13

endstop_pin: tmc5160_stepper_z2:virtual_endstop

gear_ratio: 80:16
full_steps_per_rotation:200
rotation_distance: 40
microsteps: 32

[stepper_z3] #[Z2 RF]
step_pin: PG11
dir_pin: PD7
enable_pin: !PG12

endstop_pin: tmc5160_stepper_z3:virtual_endstop

gear_ratio: 80:16
full_steps_per_rotation:200
rotation_distance: 40
microsteps: 32


[tmc5160 stepper_z] #[Z3 LF]
cs_pin: PA9
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: false

diag1_pin: !PF10
driver_SGT: 1

run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z1] #[Z4 LB]
cs_pin: PA10
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: false

diag1_pin: !PC0
driver_SGT: 1

run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z2] #[Z1 RB]
cs_pin: PD2
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: false

diag1_pin: !PF3
driver_SGT: 1

run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z3] #[Z2 RF]
cs_pin: PA15
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: false

diag1_pin: !PF4
driver_SGT: 1

run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 0

#--------------------------------------------------------------------------------------------

[heater_bed]
heater_pin: PF5
sensor_pin: PB0
sensor_type: Generic 3950
min_temp: 0
max_temp: 120

control: pid
pid_kp: 57.532
pid_ki: 2.740
pid_kd: 302.043

#--------------------------------------------------------------------------------------------

[controller_fan skirt_intake] #[Fan1 R]
pin: PA1
cycle_time: 0.003
idle_timeout: 300
kick_start_time: 0.2
fan_speed: 0.8

heater:
#stepper: stepper_x, stepper_y, stepper_z


[controller_fan skirt_exhaust] #[Fan0 L]
pin: PA0

cycle_time: 0.003
idle_timeout: 300
kick_start_time: 0.2
fan_speed: 0.8

heater:
#stepper: stepper_x, stepper_y, stepper_z

