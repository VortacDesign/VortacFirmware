[mcu vortac]
canbus_uuid: 70d72bfb79f1

[stepper_x]
endstop_pin: vortac:PA7

[stepper_z]
endstop_pin: probe:z_virtual_endstop

[probe]
pin: vortac:PA6
x_offset: 0
y_offset: 33.8
samples: 2
samples_result: median
speed: 5.0

[neopixel my_neopixel]
pin: vortac:PA4
chain_count: 2
color_order: GRB  # Default
initial_RED: 0.1      # 255/255
initial_GREEN: 0.1   # 192/255 ≈ 0.75
initial_BLUE: 0.7     # 203/255 ≈ 0.8

[manual_stepper grabber]
step_pin: vortac:PA3
dir_pin: vortac:PA1
enable_pin: !vortac:PA0
full_steps_per_rotation: 64
microsteps: 1
gear_ratio: 96:1 #1/64 * 30/20
rotation_distance: 720

[tmc2209 manual_stepper grabber]
uart_pin: vortac:PA2
run_current: 0.6
hold_current: 0.02
sense_resistor: 0.068
stealthchop_threshold: 500

[angle my_angle_sensor]
sensor_type: as5047d
stepper: manual_stepper grabber
cs_pin: vortac:PB12
#spi_speed:
#spi_bus:
spi_software_sclk_pin: vortac:PB13
spi_software_miso_pin: vortac:PB14
spi_software_mosi_pin: vortac:PB15

[vortac_grabber]
angleSensor: my_angle_sensor
sample_count: 32
tool_doc_test_code: 
  ; --- DYNAMIC VARIABLE RETRIEVAL ---
  ; 1. Get the value stored in the Save Macro
  {% set stored_offset = printer["gcode_macro Z_OFFSET_APPLY_PROBE"].current_tool_offset|float %}

  ; 2. Logic: If stored_offset is greater than 0, use it. 
  ;    Otherwise, assume the tool was attached manually and default to 3.7.
  {% set my_tool_offset = stored_offset if stored_offset > 0 else 3.7 %}

  ; --- DEBUGGING (Optional) ---
  RESPOND MSG="Detected Tool Offset: {my_tool_offset} (Source: {'Variable' if stored_offset > 0 else 'Default'})"

  ; Load saved Dock Posiiton
  {% set x = vortac_grabber.params_x_doc_pos|float %}
  {% set y = vortac_grabber.params_y_doc_pos|float %}
  {% set z = vortac_grabber.params_z_doc_pos|float %}
  
  ;remember old Probe z-Offset and BedMesh
  {% set global_probe_offset = -printer.configfile.settings.probe.z_offset %}
  {% set current_mesh = printer.bed_mesh.profile_name %}
  RESPOND MSG="textx {x} {global_probe_offset} offset"
  RESPOND MSG="Saved Offset and bedmesh {tool_offset}"

  ; Clear Bedmesh and zOffset for DockPositioning
  BED_MESH_CLEAR                ; Disable Mesh
  SET_GCODE_OFFSET Z=0 MOVE=0   ; Disable all Z offsets
  SET_GCODE_OFFSET X=0 Y=0      ; Disable X/Y offsets
  G90                           ; Absolute Positioning
  RESPOND MSG="Cleared ZOffset for loading}"


  ; Move 50mm in front of saved Dock Posiiton be save and move Y first
  G1 Y{y+50} F2000
  G1 X{x} Z{z} F2000

  ; Calculate the Total Z Offset
  {% set final_z = global_probe_offset %}; no need to re add tool offset as we don't have a tool 
  
  ; Apply the Combined Offset
  SET_GCODE_OFFSET Z={final_z} MOVE=0
  
  ; Restore Bed Mesh
  {% if current_mesh and current_mesh != "default" and current_mesh != "" %}
      BED_MESH_PROFILE LOAD={current_mesh}
      RESPOND MSG="Restored Mesh: {current_mesh}"
  {% endif %}

tool_doc_load: 
    {% set my_tool_offset = 3.7 %}
    
    ; Load saved Dock Posiiton
    {% set x = vortac_grabber.params_x_doc_pos|float %}
    {% set y = vortac_grabber.params_y_doc_pos|float %}
    {% set z = vortac_grabber.params_z_doc_pos|float %}
    
    ; Remember old Probe z-Offset and BedMesh
    {% set global_probe_offset = -printer.configfile.settings.probe.z_offset %}
    {% set current_mesh = printer.bed_mesh.profile_name %}
    
    RESPOND MSG="Loading Tool... Base Probe Offset: {global_probe_offset}"

    ; --- CLEAR OFFSETS ---
    BED_MESH_CLEAR                ; Disable Mesh
    SET_GCODE_OFFSET Z=0 MOVE=0   ; Disable all Z offsets
    SET_GCODE_OFFSET X=0 Y=0      ; Disable X/Y offsets
    G90                           ; Absolute Positioning

    ; --- MOVEMENT LOGIC ---
    VORTAC_MOVE TARGET=0          ; Disengage Vortac key
    G1 X{x} Y{y+50} Z{z-4.4} F2000 ; Move to pre-dock
    G1 Y{y} F500                  ; Move to dock
    VORTAC_MOVE TARGET=120        ; Engage Key
    G1 Z{z} F500                  ; Lift toolhead
    G1 Y{y+50} F500               ; Move back out
   
    ; --- APPLY OFFSET LOGIC ---
    ; Calculate the Total Z Offset (Probe + Tool)
    {% set final_z = global_probe_offset + my_tool_offset %}
   
    ; Apply the Combined Offset for printing
    SET_GCODE_OFFSET Z={final_z} MOVE=0
   
    ; !!! CRITICAL STEP FOR SAVING !!!
    ; We send the hardcoded tool offset to the Save Macro variable
    SET_GCODE_VARIABLE MACRO=Z_OFFSET_APPLY_PROBE VARIABLE=current_tool_offset VALUE={my_tool_offset}
   
    ; --- RESTORE STATE ---
    {% if current_mesh and current_mesh != "default" and current_mesh != "" %}
        BED_MESH_PROFILE LOAD={current_mesh}
        RESPOND MSG="Restored Mesh: {current_mesh}"
    {% endif %}
    
    RESPOND MSG="Tool Loaded. Offset Active. Safe to use Live-Z."

tool_doc_unload: 
  ; --- DYNAMIC VARIABLE RETRIEVAL ---
  ; 1. Get the value stored in the Save Macro
  {% set stored_offset = printer["gcode_macro Z_OFFSET_APPLY_PROBE"].current_tool_offset|float %}

  ; 2. Logic: If stored_offset is greater than 0, use it. 
  ;    Otherwise, assume the tool was attached manually and default to 3.7.
  {% set my_tool_offset = stored_offset if stored_offset > 0 else 3.7 %}

  ; --- DEBUGGING (Optional) ---
  RESPOND MSG="Detected Tool Offset: {my_tool_offset} (Source: {'Variable' if stored_offset > 0 else 'Default'})"
    
   ; Load saved Dock Posiiton
  {% set x = vortac_grabber.params_x_doc_pos|float %}
  {% set y = vortac_grabber.params_y_doc_pos|float %}
  {% set z = vortac_grabber.params_z_doc_pos|float %}
  
  ;remember old Probe z-Offset and BedMesh
  {% set global_probe_offset = -printer.configfile.settings.probe.z_offset %}
  {% set current_total_offset = printer.gcode_move.homing_origin.z %}
  {% set current_mesh = printer.bed_mesh.profile_name %}
  RESPOND MSG="text {x} {global_probe_offset} offset"
  RESPOND MSG="Saved Offset and bedmesh {tool_offset}"

  ; Clear Bedmesh and zOffset for DockPositioning
  BED_MESH_CLEAR                ; Disable Mesh
  SET_GCODE_OFFSET Z=0 MOVE=0   ; Disable all Z offsets
  SET_GCODE_OFFSET X=0 Y=0      ; Disable X/Y offsets
  G90                           ; Absolute Positioning
  RESPOND MSG="Cleared ZOffset for loading}"
  
  ;move in front of docking position z for unload
  G1 X{x} Y{y+50} Z{z} F2000 
  ;move towards docking position
  G1 Y{y} F500
  ;move in front of docking position z -4.4 for unload
  G1 Z{z-4.4} F500
  ;this disengages the key
  VORTAC_MOVE TARGET=0
  ;move back
  G1 Y{y+50} F500

 ; Calculate the Total Z Offset
  {% set final_z = current_total_offset - my_tool_offset %} ; no need to re add tool offset as we don't have a tool 
  
  ; Apply the Combined Offset
  SET_GCODE_OFFSET Z={final_z} MOVE=0

      ; !!! CRITICAL STEP FOR SAVING !!!
    ; We send the hardcoded tool offset to the Save Macro variable
    SET_GCODE_VARIABLE MACRO=Z_OFFSET_APPLY_PROBE VARIABLE=current_tool_offset VALUE={0}
  
  ; Restore Bed Mesh
  {% if current_mesh and current_mesh != "default" and current_mesh != "" %}
      BED_MESH_PROFILE LOAD={current_mesh}
      RESPOND MSG="Restored Mesh: {current_mesh}"
  {% endif %}


# Captures QGL deltas; provides VORTAC_GANTRY_FLAT / VORTAC_GANTRY_TILT
# to toggle between gantry-parallel-to-frame (dock geometry) and
# gantry-parallel-to-bed (print geometry). See klippy/extras/vortac_qgl_state.py.
[vortac_qgl_state]
