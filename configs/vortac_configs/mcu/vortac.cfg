[mcu vortac]
canbus_uuid: 70d72bfb79f1

[stepper_x]
endstop_pin: vortac:PA7

# [stepper_z]
# endstop_pin: probe:z_virtual_endstop

[probe]
pin: vortac:PA6
x_offset: 0
y_offset: 33.8
samples: 2
samples_result: median
speed: 5.0

[neopixel my_neopixel]
pin: vortac:PA4
chain_count: 2
color_order: GRB  # Default
initial_RED: 0.1      # 255/255
initial_GREEN: 0.1   # 192/255 ≈ 0.75
initial_BLUE: 0.7     # 203/255 ≈ 0.8

[manual_stepper grabber]
step_pin: vortac:PA3
dir_pin: !vortac:PA1
enable_pin: !vortac:PA0
full_steps_per_rotation: 64
microsteps: 1
gear_ratio: 96:1 #1/64 * 30/20
rotation_distance: 720

[tmc2209 manual_stepper grabber]
uart_pin: vortac:PA2
run_current: 0.6
hold_current: 0.02
sense_resistor: 0.068
stealthchop_threshold: 500

[angle my_angle_sensor]
sensor_type: as5047d
stepper: manual_stepper grabber
cs_pin: vortac:PB12
#spi_speed:
#spi_bus:
spi_software_sclk_pin: vortac:PB13
spi_software_miso_pin: vortac:PB14
spi_software_mosi_pin: vortac:PB15

[vortac_grabber]
angleSensor: my_angle_sensor
sample_count: 32
#move_tol: 2.0          # deg; engage()/disengage() (and VORTAC_MOVE's TOL)
                        # count as arrived within this. Missing it is a hard
                        # error — a key that did not turn rams the tool at
                        # the dock. VORTAC_ENGAGE/DISENGAGE/MOVE CHECK=0
                        # downgrades that to a report (manual/debug only).
# Phase 2: dock load/unload templates removed. The grabber is now hardware-only;
# tool-change orchestration (approach/depart, gantry FLAT/TILT, offsets) lives
# in vortac_manager (Phase 5). Per-tool hooked dock positions live on
# [vortac_tool Tn].

# Captures QGL deltas; provides VORTAC_GANTRY_FLAT / VORTAC_GANTRY_TILT
# to toggle between gantry-parallel-to-frame (dock geometry) and
# gantry-parallel-to-bed (print geometry). See klippy/extras/vortac_qgl_state.py.
[vortac_qgl_state]
#flatten_speed: 5.0
