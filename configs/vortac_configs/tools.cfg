# tools.cfg — Vortac toolchanger registry + manager.
#
# Include this from printer.cfg after the grabber is set up:
#
#     [include vortac_configs/mcu/vortac.cfg]    # grabber MCU + [vortac_grabber]
#     [include vortac_configs/tools.cfg]         # this file
#
# Add per-tool files to the includes below as you bring tools online.

[include tools/miniStealth_pink.cfg]
[include tools/miniStealth_grey.cfg]
# [include tools/tool2.cfg]
# [include tools/tool3.cfg]


[vortac_manager]
dock_count:         2
argb_led:           dockController  # neopixel chain on mainboard
argb_channel:       green           # G channel = Tool_id dock strobe
dock_strobe_time:   0.10            # seconds to wait after each strobe change

# The dock approach / depart sequence is hardcoded in vortac_manager.py
# (constants DOCK_Y_SAFE / DOCK_Z_CLEARANCE / feedrates at the top of the
# file). For per-tool tweaks, use [vortac_tool Tn].tool_activate_gcode and
# tool_deactivate_gcode — those run on either side of the dock motion.
