# macros.example.cfg — print-start / print-end routines and the per-tool
# park/pick hooks for the Vortac toolchanger, written against OrcaSlicer's
# multi-tool output.
#
# Copy this file next to your printer.cfg (or into vortac_configs/ and keep
# it there — it is a normal Klipper include) and add it AFTER tools.cfg:
#
#     [include vortac_configs/tools.cfg]
#     [include vortac_configs/macros.cfg]
#
# Klipper never reads .example files, so the copy is what counts.
#
# WHY THE ORDER IN PRINT_START IS NOT NEGOTIABLE
#   * Probing is refused while a tool is held (the probe touch point sits
#     ABOVE the nozzle tip — the nozzle would reach the bed first). So
#     G28 / QUAD_GANTRY_LEVEL / BED_MESH_CALIBRATE all have to run with an
#     empty carriage, BEFORE the first T<n>.
#   * Homing itself is fine with a tool on the carriage — Z homes sensorless
#     against the top of the frame, the probe is not involved. So a print can
#     be started from a grabbed tool: home first, park second.
#   * Never re-home Z after QUAD_GANTRY_LEVEL. Homing resets the gantry to
#     "flat" and discards the stored deltas, which throws the levelling away.
#     Home first, level second. VORTAC_QGL_STATUS must read "tilted" when
#     PRINT_START ends.
#   * Every step below is conditional on the machine state: already homed ->
#     no second G28, dock map already valid -> no second VORTAC_DETECT.
#     Set always_home / always_detect in _VORTAC_PRINT_VARS to force them.
#   * T<n> is the whole tool change: park old -> fetch new -> restore tilt ->
#     apply offsets. Never add dock moves in the slicer.
#
# TEMPERATURES — READ THIS BEFORE THE FIRST MULTI-TOOL PRINT
#   PRINT_START receives ONE hotend temperature, so on its own it can only
#   heat the tool the print starts with. Every other tool is cold when the
#   first tool change happens, and the slicer's first extrusion after it
#   fails with "Extrude below minimum temp".
#
#   This file closes that hole in two independent ways, and you want both:
#
#     1. TEMPS=  — the slicer passes the first-layer temperature of EVERY
#        extruder (see the PRINT_START header below). PRINT_START stores
#        them, keeps all nozzles at soak_temp while it homes/levels/meshes
#        (no ooze into the docks during those minutes), and brings them up
#        afterwards.
#
#     2. The park/pick hooks — _VORTAC_TOOL_PARK / _VORTAC_TOOL_PICK, wired
#        into the tool sections via include_with overrides (see
#        tools/tool0.example.cfg). _VORTAC_TOOL_PICK ALWAYS waits for the
#        arriving tool to reach temperature, so a cold nozzle can no longer
#        be extruded through, no matter what the slicer did or did not emit.
#
#   Both are optional in the sense that the file loads without them — but a
#   multi-tool print without either one will abort at the first change.
#
#   Leave Orca's "Emit temperature commands automatically" OFF when you use
#   the standby mechanism below. With it on, Orca re-sends the full print
#   temperature for every extruder at the start of the second layer, which
#   overrides the standby drop of the tool that is currently parked.
#   The trade-off: nobody switches from the first-layer temperature to the
#   normal one either, so the whole print runs at what TEMPS= carried. Set
#   both to the same value in the filament profile — or pass the normal
#   temperature in TEMPS if the two differ and the tower matters more than
#   the first layer.


[gcode_macro _VORTAC_PRINT_VARS]
description: Tunables shared by PRINT_START / PRINT_END and the tool hooks. Edit these, not the macros.
# --- start-up state -------------------------------------------------------
# PRINT_START only homes when the axes are not homed already, and only runs
# VORTAC_DETECT when the dock map is not valid yet. Set either to 1 to do it
# unconditionally on every print start.
variable_always_home:      0
variable_always_detect:    0
# --- preheat / soak -------------------------------------------------------
# soak_temp is what every nozzle sits at while the bed soaks and the machine
# homes, levels and meshes: hot enough not to be stone cold, cold enough not
# to ooze into the docks. It doubles as the threshold that tells a real print
# temperature from a parking/idle one — _VORTAC_TOOL_PARK only memorises a
# target ABOVE this value as "the temperature to come back to".
variable_soak_temp:      150    # nozzle temp while the bed soaks (no ooze)
variable_soak_minutes:     0    # extra bed soak after M190, 0 = off
# --- standby / ooze control ----------------------------------------------
# A parked tool keeps its board powered (an occupied dock is never
# de-energized), so it holds whatever target it had. At ABS temperatures that
# means it drips into the dock for the whole print. standby_delta drops the
# nozzle by that many kelvin the moment the tool is parked; _VORTAC_TOOL_PICK
# puts it back and WAITS before anything is extruded.
#
# The price is heat-up time on every tool change — the manager cannot preheat
# the next tool, because when it parks one it does not yet know which one is
# coming. 40-60 K is the sweet spot: enough to stop the dripping, quick
# enough to come back. standby_delta: 0 disables the whole mechanism (the
# temperature wait in _VORTAC_TOOL_PICK stays active either way).
variable_standby_delta:   50    # K below print temp while parked, 0 = off
variable_standby_min:    150    # never drop below this
variable_temp_tolerance:   3    # K below target that counts as "reached"
# --- tool-change retract / prime ------------------------------------------
# This is ON TOP of the slicer's own tool-change retraction. The slicer
# retracts before it emits T<n>; everything after that — the travel to the
# dock row, the stepwise hook-in, the fetch of the next tool — happens on the
# manager's clock and is where the long ooze happens.
# park_retract is given back on pickup, plus extra_prime to refill the melt
# zone. Keep extra_prime small; the prime tower takes care of the rest.
variable_park_retract:    1.5   # mm extra retract when the tool is parked
variable_park_speed:     2400   # mm/min for that retract
variable_extra_prime:     0.4   # mm extra on top when the tool comes back
variable_prime_speed:     300   # mm/min for the deretract
# --- prime line -----------------------------------------------------------
# Drawn once for the first tool of the print. One line per tool index, offset
# in Y so two tools never draw on top of each other. Set purge_enable: 0 if
# your build has a purge bucket, or if you run a prime tower and do not want
# a second priming spot on the bed.
variable_purge_enable:     1
variable_purge_x:       10.0
variable_purge_y:       10.0
variable_purge_y_step:   3.0    # Y offset per tool index
variable_purge_z:       0.30
variable_purge_len:     80.0    # mm of line
variable_purge_e:       12.0    # mm of filament for that line
variable_purge_speed:   1200    # mm/min while extruding
# --- end of print ---------------------------------------------------------
variable_end_retract:    3.0    # mm retract before the toolhead leaves
variable_end_z_hop:      5.0    # mm lift off the part before parking
variable_end_park_x:   150.0    # where the empty carriage waits afterwards
variable_end_park_y:   300.0
gcode:
    # variable-only holder, nothing to run


# ---------------------------------------------------------------------------
# _VORTAC_TOOL_STATE — runtime scratch space, written by the macros below.
#
# print_temps[i]  the temperature tool i is supposed to print at. Filled by
#                 PRINT_START (from TEMPS=, or from whatever target the
#                 slicer already set) and refreshed by _VORTAC_TOOL_PARK
#                 whenever a tool is parked from a real print temperature.
# retracted[i]    True while tool i is parked with park_retract pulled back,
#                 so _VORTAC_TOOL_PICK gives back exactly what was taken and
#                 never primes a tool that was not retracted in the first
#                 place (which would blob at the start of a print).
#
# Both are indexed by tool_index, i.e. the n in T<n>. Do not edit by hand.
# ---------------------------------------------------------------------------
[gcode_macro _VORTAC_TOOL_STATE]
description: Internal state of the Vortac tool hooks — written by the macros, do not edit
variable_print_temps: []
variable_retracted: []
gcode:
    # variable-only holder, nothing to run


# ---------------------------------------------------------------------------
# PRINT_START
#
# Orca call (Machine start G-code) — ONE line, and note the indexed
# placeholders. TEMPS carries one first-layer temperature per extruder, in
# extruder order; add an entry when you add a tool:
#
#   PRINT_START BED=[bed_temperature_initial_layer_single] \
#               TOOL={initial_extruder} \
#               HOTEND={nozzle_temperature_initial_layer[initial_extruder]} \
#               TEMPS={nozzle_temperature_initial_layer[0]},{nozzle_temperature_initial_layer[1]}
#
# TEMPS is optional: without it PRINT_START falls back to whatever targets
# the slicer has already set (that needs "Emit temperature commands
# automatically" ON in Orca), and finally to HOTEND for the starting tool.
#
# MESH=calibrate (default) probes a fresh mesh, MESH=<name> loads a saved
# profile, MESH=none skips meshing entirely.
# ---------------------------------------------------------------------------
[gcode_macro PRINT_START]
description: Toolchanger-safe print start (empty carriage -> probe -> tool -> prime)
gcode:
    {% set V      = printer['gcode_macro _VORTAC_PRINT_VARS'] %}
    {% set bed    = params.BED|default(60)|float %}
    {% set hotend = params.HOTEND|default(0)|float %}
    {% set tool   = params.TOOL|default(0)|int %}
    {% set mesh   = params.MESH|default('calibrate')|string|lower %}
    {% set soak   = params.SOAK|default(V.soak_minutes)|int %}

    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    M220 S100
    M221 S100
    M107
    G90

    # 0) Work out one print temperature per tool index and remember it.
    #    Priority: TEMPS= from the slicer -> a target the slicer already set
    #    -> HOTEND= for the starting tool. Anything still 0 stays 0 and is
    #    reported as an error by _VORTAC_TOOL_PICK when that tool is fetched,
    #    instead of failing later as "Extrude below minimum temp".
    {% set given = params.TEMPS|default('')|string %}
    {% set glist = given.split(',') if given else [] %}
    {% set ns = namespace(n=0) %}
    {% for tid in printer.vortac_manager.tools %}
        {% set ti = printer['vortac_tool ' ~ tid].tool_index %}
        {% if ti is not none and ti + 1 > ns.n %}{% set ns.n = ti + 1 %}{% endif %}
    {% endfor %}
    {% set temps = [] %}
    {% set flags = [] %}
    {% for i in range(ns.n) %}
        {% set en = namespace(name=none) %}
        {% for tid in printer.vortac_manager.tools %}
            {% set t = printer['vortac_tool ' ~ tid] %}
            {% if t.tool_index == i %}{% set en.name = t.extruder_name %}{% endif %}
        {% endfor %}
        {% set live = printer[en.name].target|float
                      if en.name is not none and en.name in printer else 0.0 %}
        {% set slic = glist[i]|float if glist|length > i else 0.0 %}
        {% set val  = slic if slic > 0 else (live if live > 0
                      else (hotend if i == tool else 0.0)) %}
        {% set _ = temps.append(val) %}
        {% set _ = flags.append(False) %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_VORTAC_TOOL_STATE VARIABLE=print_temps VALUE=[{temps|join(',')}]
    SET_GCODE_VARIABLE MACRO=_VORTAC_TOOL_STATE VARIABLE=retracted VALUE=[{flags|join(',')}]

    # 1) bed up first — the long pole. EVERY nozzle only to soak temp, so
    #    nothing drips into a dock while the machine homes, levels and meshes.
    M140 S{bed}
    _VORTAC_ALL_NOZZLES TEMP={V.soak_temp}

    # 2) home if needed. A held tool does not stand in the way here — Z homes
    #    sensorless at the top, no probe. Skipped when already homed.
    {% if printer.toolhead.homed_axes != 'xyz' or V.always_home|int %}
        G28
    {% endif %}

    # 3) the carriage MUST be empty before anything probes.
    _VORTAC_ENSURE_EMPTY

    # 4) heat-soak with the gantry parked out of the way
    M190 S{bed}
    {% if soak > 0 %}
        G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} Z20 F6000
        M117 Soaking {soak} min
        G4 P{soak * 60000}
    {% endif %}

    # 5) probe-based steps — still no tool held. Do NOT G28 Z after QGL.
    QUAD_GANTRY_LEVEL
    {% if mesh == 'calibrate' %}
        BED_MESH_CALIBRATE
    {% elif mesh not in ('none', 'off', '0') %}
        BED_MESH_PROFILE LOAD={mesh}
    {% endif %}

    # 6) dock map (auto_detect ran it at startup, _VORTAC_ENSURE_EMPTY may
    #    have refreshed it — only repeat it if it is not valid), then the
    #    first tool. T<n> does park/fetch/tilt/offsets, and its
    #    tool_activate_gcode hook brings this tool to temperature and waits.
    {% if not printer.vortac_manager.dock_detection_valid or V.always_detect|int %}
        VORTAC_DETECT
    {% endif %}
    T{tool}

    # 7) belt and braces: wait for the starting tool even if the park/pick
    #    hooks are not wired up yet. No-op once _VORTAC_TOOL_PICK has run.
    {% set start_temp = temps[tool] if temps|length > tool else hotend %}
    {% if start_temp > 0 %}
        M109 S{start_temp}
    {% endif %}

    # 8) bring the idle tools up to their standby temperature so the first
    #    tool change does not have to heat one from soak temp.
    _VORTAC_PREHEAT_IDLE EXCEPT={tool}

    {% if V.purge_enable|int %}
        _VORTAC_PRIME_LINE TOOL={tool}
    {% endif %}
    M117 Printing


# ---------------------------------------------------------------------------
# PRINT_END — always ends with an EMPTY carriage, so the next PRINT_START can
# probe without a manual park.
# ---------------------------------------------------------------------------
[gcode_macro PRINT_END]
description: Retract, park the tool back in its dock, cool down
gcode:
    {% set V  = printer['gcode_macro _VORTAC_PRINT_VARS'] %}
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + V.end_z_hop|float, th.axis_maximum.z|float - 2.0]|min %}

    M400
    G91
    {% if printer[th.extruder].can_extrude %}
        G1 E-{V.end_retract} F2100
    {% endif %}
    {% if z_safe > th.position.z %}
        G1 Z{z_safe - th.position.z} F1200
    {% endif %}
    G90
    M107

    # Hotends off before the park move — the dock does not need heat, and the
    # tool cools while it travels. Bed stays until the tool is stowed. With
    # the target at 0 the park hook skips the standby drop as well.
    _VORTAC_ALL_NOZZLES TEMP=0

    # Park whatever is held. Harmless if the carriage is already empty.
    VORTAC_UNLOAD

    TURN_OFF_HEATERS
    G1 X{V.end_park_x} Y{V.end_park_y} F6000
    M400
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    BED_MESH_CLEAR
    # Drop the retract bookkeeping: the next print starts from a clean sheet
    # and must not prime a tool "back" that this print pulled out.
    SET_GCODE_VARIABLE MACRO=_VORTAC_TOOL_STATE VARIABLE=retracted VALUE=[]
    M84
    M117 Done


# ---------------------------------------------------------------------------
# Cancel goes through PRINT_END so a cancelled print also leaves the carriage
# empty — otherwise the next print cannot probe.
# ---------------------------------------------------------------------------
[gcode_macro CANCEL_PRINT]
description: Cancel the running print (parks the tool first)
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
    PRINT_END
    CANCEL_PRINT_BASE


# ---------------------------------------------------------------------------
# Per-tool hooks — wire them up in the tool file via include_with overrides:
#
#   overrides:
#     vortac_tool TN.tool_deactivate_gcode: _VORTAC_TOOL_PARK EXTRUDER={tool.extruder_name} IDX={tool.tool_index}
#     vortac_tool TN.tool_activate_gcode: _VORTAC_TOOL_PICK EXTRUDER={tool.extruder_name} IDX={tool.tool_index}
#
# `overrides` parses ONE LINE per entry, which is why the real logic lives
# here in a macro instead of inline in the tool file.
#
# WHEN THEY RUN (vortac_manager._change_tool):
#   tool_deactivate_gcode is step 1 — before the gantry goes flat, before the
#   gcode offset is zeroed, before any dock motion. The OLD tool is still the
#   active extruder and the toolhead still stands at the print position, so
#   this is the only place a retract reaches the right hotend.
#   tool_activate_gcode is step 6 — after the fetch, after GANTRY_TILT, after
#   the mesh is restored, after ACTIVATE_EXTRUDER and SET_GCODE_OFFSET for
#   the NEW tool. Extrusion here goes to the tool that was just picked up.
# ---------------------------------------------------------------------------

[gcode_macro _VORTAC_TOOL_PARK]
description: tool_deactivate_gcode hook — extra retract, then drop to standby temperature
gcode:
    {% set V   = printer['gcode_macro _VORTAC_PRINT_VARS'] %}
    {% set S   = printer['gcode_macro _VORTAC_TOOL_STATE'] %}
    {% set e   = params.EXTRUDER %}
    {% set idx = params.IDX|int %}
    {% set r   = V.park_retract|float %}
    {% set tgt = printer[e].target|float %}

    # Retract only if the nozzle is actually molten. During PRINT_START the
    # carriage is emptied while every nozzle sits at soak_temp — below
    # min_extrude_temp — and a G1 E there would abort the print start.
    {% if r > 0 and printer[e].can_extrude %}
        SAVE_GCODE_STATE NAME=_vortac_park
        M83
        G1 E-{r} F{V.park_speed}
        RESTORE_GCODE_STATE NAME=_vortac_park MOVE=0
        {% set n = [S.retracted|length, idx + 1]|max %}
        {% set fl = [] %}
        {% for i in range(n) %}
            {% set _ = fl.append(True if i == idx
                        else (S.retracted[i] if S.retracted|length > i else False)) %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_VORTAC_TOOL_STATE VARIABLE=retracted VALUE=[{fl|join(',')}]
    {% endif %}

    # Memorise the temperature to come back to, but only if this really is a
    # print temperature. soak_temp and below is the machine idling (print
    # start, print end) — remembering that would send the tool back to a
    # nozzle that cannot extrude.
    {% if tgt > V.soak_temp|float %}
        {% set n = [S.print_temps|length, idx + 1]|max %}
        {% set tp = [] %}
        {% for i in range(n) %}
            {% set _ = tp.append(tgt if i == idx
                        else (S.print_temps[i] if S.print_temps|length > i else 0.0)) %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_VORTAC_TOOL_STATE VARIABLE=print_temps VALUE=[{tp|join(',')}]
        {% set st = [tgt - V.standby_delta|float, V.standby_min|float]|max %}
        {% if st < tgt %}
            SET_HEATER_TEMPERATURE HEATER={e} TARGET={st}
        {% endif %}
    {% endif %}


[gcode_macro _VORTAC_TOOL_PICK]
description: tool_activate_gcode hook — back to print temperature, wait, undo the park retract
gcode:
    {% set V   = printer['gcode_macro _VORTAC_PRINT_VARS'] %}
    {% set S   = printer['gcode_macro _VORTAC_TOOL_STATE'] %}
    {% set e   = params.EXTRUDER %}
    {% set idx = params.IDX|int %}
    {% set want = S.print_temps[idx]|float if S.print_temps|length > idx else 0.0 %}
    {% set live = printer[e].target|float %}

    # Whose value wins? Normally the memorised print temperature — the tool
    # is sitting at the standby target this macro's counterpart put it at,
    # and that is precisely the value that must NOT be restored.
    #
    # But a target can also have been changed on purpose while the tool was
    # parked: a temperature tower, a per-object temperature, a slider pull in
    # Mainsail. Blindly restoring would silently undo that. So: work out the
    # standby value we would have left behind, and if the live target is
    # something else entirely, the live target is the deliberate one and it
    # wins (and becomes the new memorised value further down).
    #
    # soak_temp and below never counts as deliberate — that is PRINT_START
    # holding the nozzles down while it homes, levels and meshes, and coming
    # up from it is the whole point of this macro.
    {% set expect = [want - V.standby_delta|float, V.standby_min|float]|max
                    if want > 0 else 0.0 %}
    {% set changed = want > 0 and live > V.soak_temp|float
                     and (live - expect)|abs > 1.0
                     and (live - want)|abs > 1.0 %}
    {% set tgt = live if changed else (want if want > 0 else live) %}

    # No temperature from anywhere. Mid-print that is fatal, so fail HERE
    # with the reason instead of letting the slicer's next extrusion die on
    # min_extrude_temp. Outside a print it is completely normal — dry runs
    # and dock calibration fetch tools cold — so only say so and carry on.
    {% set printing = 'print_stats' in printer
                      and printer.print_stats.state == 'printing' %}
    {% if tgt > 0 %}
        SET_HEATER_TEMPERATURE HEATER={e} TARGET={tgt}
        TEMPERATURE_WAIT SENSOR={e} MINIMUM={tgt - V.temp_tolerance|float}
        {% if changed %}
            {% set tp = [] %}
            {% for i in range(S.print_temps|length) %}
                {% set _ = tp.append(tgt if i == idx else S.print_temps[i]) %}
            {% endfor %}
            SET_GCODE_VARIABLE MACRO=_VORTAC_TOOL_STATE VARIABLE=print_temps VALUE=[{tp|join(',')}]
            { action_respond_info(
                "Vortac: T%d came back to a changed target (%.0fC instead of "
                "%.0fC) — keeping the new one." % (idx, tgt, want)) }
        {% endif %}
    {% elif printing %}
        { action_raise_error(
            "Vortac: no hotend temperature known for T%d (%s). Pass TEMPS= "
            "from the slicer to PRINT_START, or enable Orca's 'Emit "
            "temperature commands automatically'." % (idx, e)) }
    {% else %}
        { action_respond_info(
            "Vortac: T%d picked up cold — no hotend temperature known. "
            "Normal for dry runs and dock calibration." % idx) }
    {% endif %}

    # Give back exactly what _VORTAC_TOOL_PARK took, plus the refill. Only
    # for a tool that was actually parked retracted — the first pickup of a
    # print was never retracted and must not be primed here.
    {% if S.retracted|length > idx and S.retracted[idx] %}
        SAVE_GCODE_STATE NAME=_vortac_pick
        M83
        G1 E{V.park_retract|float + V.extra_prime|float} F{V.prime_speed}
        RESTORE_GCODE_STATE NAME=_vortac_pick MOVE=0
        {% set fl = [] %}
        {% for i in range(S.retracted|length) %}
            {% set _ = fl.append(False if i == idx else S.retracted[i]) %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_VORTAC_TOOL_STATE VARIABLE=retracted VALUE=[{fl|join(',')}]
    {% endif %}


# ---------------------------------------------------------------------------
# Helpers
# ---------------------------------------------------------------------------

[gcode_macro _VORTAC_ENSURE_EMPTY]
description: Guarantee no tool is on the carriage before any probing happens (homes first if needed)
gcode:
    {% set mgr = printer.vortac_manager %}
    {% set grabbed = [] %}
    {% for tid in mgr.tools %}
        {% if printer['vortac_tool ' ~ tid].grab_sense_state == False %}
            {% set _ = grabbed.append(tid) %}
        {% endif %}
    {% endfor %}
    {% if mgr.current_tool is not none or grabbed %}
        # Parking is an absolute move to the dock, so the axes have to be
        # homed — but homing with a tool held is allowed (sensorless Z at the
        # top, no probe). Home here only if PRINT_START has not already.
        {% if printer.toolhead.homed_axes != 'xyz' %}
            G28
        {% endif %}
        {% if mgr.current_tool is none %}
            VORTAC_DETECT
        {% endif %}
        VORTAC_UNLOAD
    {% endif %}


[gcode_macro _VORTAC_SET_TOOL_TEMP]
description: Set a tool's hotend target by tool index, without activating it
gcode:
    {% set idx  = params.TOOL|int %}
    {% set temp = params.TEMP|float %}
    {% set ns = namespace(heater=none) %}
    {% for tid in printer.vortac_manager.tools %}
        {% set t = printer['vortac_tool ' ~ tid] %}
        {% if t.tool_index == idx %}{% set ns.heater = t.extruder_name %}{% endif %}
    {% endfor %}
    {% if ns.heater is not none %}
        SET_HEATER_TEMPERATURE HEATER={ns.heater} TARGET={temp}
    {% endif %}


[gcode_macro _VORTAC_ALL_NOZZLES]
description: Set the same target on every tool's hotend (bed untouched)
gcode:
    {% set temp = params.TEMP|default(0)|float %}
    {% for tid in printer.vortac_manager.tools %}
        SET_HEATER_TEMPERATURE HEATER={printer['vortac_tool ' ~ tid].extruder_name} TARGET={temp}
    {% endfor %}


[gcode_macro _VORTAC_ALL_NOZZLES_OFF]
description: Target 0 on every tool's hotend (bed untouched)
gcode:
    _VORTAC_ALL_NOZZLES TEMP=0


[gcode_macro _VORTAC_PREHEAT_IDLE]
description: Put every tool except EXCEPT= on its standby temperature (no waiting)
gcode:
    {% set V    = printer['gcode_macro _VORTAC_PRINT_VARS'] %}
    {% set S    = printer['gcode_macro _VORTAC_TOOL_STATE'] %}
    {% set skip = params.EXCEPT|default(-1)|int %}
    {% for tid in printer.vortac_manager.tools %}
        {% set t = printer['vortac_tool ' ~ tid] %}
        {% set i = t.tool_index %}
        {% if i is not none and i != skip and S.print_temps|length > i %}
            {% set p = S.print_temps[i]|float %}
            {% if p > 0 %}
                SET_HEATER_TEMPERATURE HEATER={t.extruder_name} TARGET={[p - V.standby_delta|float, V.standby_min|float]|max}
            {% endif %}
        {% endif %}
    {% endfor %}


[gcode_macro _VORTAC_PRIME_LINE]
description: Draw one prime line, offset in Y by tool index so tools do not overlap
gcode:
    {% set V   = printer['gcode_macro _VORTAC_PRINT_VARS'] %}
    {% set idx = params.TOOL|default(0)|int %}
    {% set y   = V.purge_y|float + idx * V.purge_y_step|float %}
    G90
    G1 X{V.purge_x} Y{y} F6000
    G1 Z{V.purge_z} F600
    G92 E0
    G1 X{V.purge_x|float + V.purge_len|float} E{V.purge_e} F{V.purge_speed}
    G92 E0
    G1 Z{V.purge_z|float + 2.0} F600


