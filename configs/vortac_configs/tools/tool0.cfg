# Tool 0 — hardware include + logical [vortac_tool] section.
#
# Klipper registers MCU pin chips before extras load, so [mcu tool0] must be
# declared statically. include_with then reuses the shared SB2209 template for
# the rest of the board hardware under the tool0 namespace.
#
# Both T0 and T1 (and any further SB2209-based tools) share ONE template:
# vortac_configs/mcu/SB2209.cfg. That's the whole point of include_with — one
# PCB-level config, instantiated multiple times under different MCU namespaces with
# section auto-renaming so [extruder] becomes [extruder1] etc.
#
# To deploy a second tool: copy this file to tool1.cfg, change `T0` -> `T1`,
# bump tool_index, set the new canbus_uuid + mcu_name + sense pin namespaces
# (e.g. ^tool1:PB15 / ^tool1:PB8), and adjust the per-dock positions.

[mcu tool0]
canbus_uuid:       73d169988077

[include_with tool0 vortac_configs/mcu/SB2209.cfg]
tool_index:        0
mcu_from:          EBBCan
skip_sections:
  mcu EBBCan
  resonance_tester
  input_shaper
  shaketune

[vortac_tool T0]
tool_index:        0
canbus_uuid:       73d169988077
mcu_name:          tool0

# Tool-change configuration
home_dock:         dock0
dock_sense_pin:    !tool0:PB15       # dock Tool_id active state after opto logic
grab_sense_pin:    tool0:PB8         # default HIGH; pulled LOW by grabber

# GCode offsets (printer.cfg's printer-frame coordinates -> nozzle position)
gcode_offset_x:    0.0
gcode_offset_y:    0.0
gcode_offset_z:    0.0

# Per-dock positions (calibrate with VORTAC_DOCK_SAVE_POS once Phase 5 lands).
# params_<dock>_<x|y|z>; the manager looks them up via tool.get_dock_pos().
params_dock0_x:    50.0
params_dock0_y:    0.0
params_dock0_z:    100.0

# Optional gcode hooks run by the manager around tool changes.
tool_activate_gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder

tool_deactivate_gcode:
  # (nothing for the default tool)
