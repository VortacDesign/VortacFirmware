# Tool 0 — example [vortac_tool] section.
#
# vortac_tool reads this section, optionally probes the CAN bus to confirm
# the UUID is present, then loads the toolboard template under the
# per-tool MCU namespace (`tool0` here) via include_with.
#
# Both T0 and T1 (and any further SB2209-based tools) share ONE template:
# mcu/SB2209.cfg. That's the whole point of include_with — one PCB-level
# config, instantiated multiple times under different MCU namespaces with
# section auto-renaming so [extruder] becomes [extruder1] etc.
#
# To deploy a second tool: copy this file to tool1.cfg, change `T0` -> `T1`,
# bump tool_index, set the new canbus_uuid + mcu_name + sense pin namespaces
# (e.g. tool1:PB8), and adjust the per-dock positions.

[vortac_tool T0]
tool_index:        0
canbus_uuid:       73d169988077
mcu_name:          tool0
config_template:   mcu/SB2209.cfg

# Tool-change configuration
home_dock:         dock0
dock_sense_pin:    tool0:PB8         # default HIGH; pulled LOW by dock ARGB
grab_sense_pin:    tool0:PB9         # default HIGH; pulled LOW by grabber

# GCode offsets (printer.cfg's printer-frame coordinates -> nozzle position)
gcode_offset_x:    0.0
gcode_offset_y:    0.0
gcode_offset_z:    0.0

# Per-dock positions (calibrate with VORTAC_DOCK_SAVE_POS once Phase 5 lands).
# params_<dock>_<x|y|z>; the manager looks them up via tool.get_dock_pos().
params_dock0_x:    50.0
params_dock0_y:    0.0
params_dock0_z:    100.0

# Optional gcode hooks run by the manager around tool changes.
tool_activate_gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder

tool_deactivate_gcode:
  # (nothing for the default tool)

# CAN auto-detection (defaults shown). Set auto_detect: False to skip the
# bus scan and always treat this tool as available.
#auto_detect:      True
#can_interface:    can0
#can_scan_timeout: 2.0
#klipper_root:     ~/klipper
