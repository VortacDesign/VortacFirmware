# tool0.example.cfg — template for a per-tool config (here: Tool 0).
#
# Per-tool files are user-specific (CAN UUIDs, dock positions, offsets) and
# therefore gitignored. Copy this file to tool0.cfg in the same directory,
# fill in your values, and add "[include tools/tool0.cfg]" to tools.cfg.
# Klipper never reads .example files.
#
# Convention over configuration: the trailing number links everything.
# The tool's number appears in exactly THREE places — the [mcu toolN]
# section, the [include_with toolN ...] header, and the [vortac_tool TN]
# id (plus the toolN: prefix on the sense pins). Everything else
# (tool_index, mcu_name, home_dock=dockN, mcu_from) is derived from it.
#
# [mcu toolN] must be static: Klipper registers MCU pin chips before
# extras like include_with run.
#
# All same-PCB tools share ONE template (here SB2209.cfg). include_with
# instantiates it per tool: pins are rewritten to the toolN namespace,
# named sections get a uniform toolN_ prefix ([neopixel logo_rgb] ->
# [neopixel tool0_logo_rgb]), and for N >= 1 the Klipper singletons are
# renamed too ([extruder] -> [extruder1], [fan] -> [fan_generic tool1_fan]).
#
# Per-tool hardware deviations go into `overrides:` on the include_with
# section — see the MAX31865 example below. Never edit the shared template
# for one tool.
#
# To deploy another tool: copy this file, then replace EVERY tool0/T0/dock0
# with the new number (grep the file afterwards — a missed spot merges
# silently into another tool's sections; vortac_manager will refuse to
# start on the conflicts it can detect). Set the new board's canbus_uuid.

[mcu tool0]
canbus_uuid:       aabbccddeeff     # find yours: ~/klipper/scripts/canbus_query.py

[include_with tool0 vortac_configs/mcu/SB2209.cfg]
skip_sections:
  mcu EBBCan
  resonance_tester
  input_shaper
  shaketune
# Optional per-tool deviations from the shared template. Values may use
# template-relative pin names (EBBCan: ...); keys absent from the template
# are added, an empty value deletes the option. Example — PT1000 on the
# onboard MAX31865 instead of the template thermistor:
#overrides:
#  extruder.sensor_type: MAX31865
#  extruder.sensor_pin: EBBCan: PA4
#  extruder.spi_bus: spi1
#  extruder.rtd_nominal_r: 1000
#  extruder.rtd_reference_r: 4300
#  extruder.rtd_num_of_wires: 2
#  extruder.rtd_use_50Hz_filter: True

[vortac_tool T0]
# tool_index, mcu_name and home_dock derive from the id (T0 -> 0 ->
# tool0/dock0); set them explicitly only if your build deviates.
dock_sense_pin:    !tool0:PB15       # dock Tool_id active state after opto logic
grab_sense_pin:    tool0:PB6         # default HIGH; pulled LOW by grabber

# GCode offsets (printer.cfg's printer-frame coordinates -> nozzle position)
gcode_offset_x:    0.0
gcode_offset_y:    0.0
gcode_offset_z:    0.0

# Per-dock hooked/engage positions; the manager looks them up via
# tool.get_dock_pos(). Set placeholders first, calibrate with
# VORTAC_SELECT_DOCK + VORTAC_DOCK_CAL_SAVE, then SAVE_CONFIG.
params_dock0_x:    50.0
params_dock0_y:    0.0
params_dock0_z:    100.0

# Optional gcode hooks run by the manager around tool changes.
# Tool 0 owns the primary [extruder]; tool N uses EXTRUDER=extruderN.
tool_activate_gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder

tool_deactivate_gcode:
