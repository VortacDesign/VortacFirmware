# tool0.example.cfg — template for a per-tool config.
#
# Per-tool files are user-specific (CAN UUIDs, dock positions, offsets) and
# therefore gitignored. Copy this file (any name, e.g. myTool.cfg), fill in
# your values, and add "[include tools/myTool.cfg]" to tools.cfg. Klipper
# never reads .example files.
#
# NAMING: the tool's NAME is defined exactly once — the [mcu] section /
# include_with namespace. Dashboards show the DISPLAY prefix <name><index>
# ([neopixel myTool0_logo_rgb], ...) so extruder<N> is visually matchable
# to <name><N>_*; the pure name stays the persistence key ([vortac_tool
# myTool]). In macros, address hardware index-proof via
# {tool.display_name}_logo_rgb etc.
#
# NUMBERING: the tool's NUMBER (T0, T1, ... and which tool owns Klipper's
# primary [extruder]/[fan]) comes from the include ORDER in tools.cfg —
# first include is T0. Commenting a tool out renumbers the ones after it,
# so a broken tool can be removed without orphaning [extruder1]. Its saved
# dock calibration survives in printer.cfg's autosave block (harmless ghost
# [vortac_tool <name>] section) until the tool returns.
#
# [mcu <name>] must be static: Klipper registers MCU pin chips before
# extras like include_with run.
#
# All same-PCB tools share ONE template (here SB2209.cfg). include_with
# instantiates it per tool: pins are rewritten to the namespace, named
# sections get a uniform <name>_ prefix, Klipper singletons are renamed for
# tools >= 1 ([extruder] -> [extruder1], [fan] -> [fan_generic <name>_fan]),
# and the template's [vortac_tool TN] placeholder becomes
# [vortac_tool <name>] with tool_index, mcu_name, canbus_uuid and
# extruder_name auto-injected. vortac_manager runs ACTIVATE_EXTRUDER with
# the injected extruder_name on every tool change — no per-tool
# tool_activate_gcode needed for that.
#
# DOCKS are established at runtime: run VORTAC_DETECT before the first
# tool change — docked tools are located via the strobe map, and a grabbed
# tool is assigned the first free dock that has calibrated positions for
# it (a warning is printed if none exists). An optional manual fallback
# can be pinned per tool via `vortac_tool TN.home_dock: dockX`.
#
# Per-tool deviations go into `overrides:` on the include_with section
# (MAX31865 example below). Never edit the shared template for one tool.

[mcu myTool]
canbus_uuid:       aabbccddeeff     # find yours: ~/klipper/scripts/canbus_query.py

[include_with myTool vortac_configs/mcu/SB2209.cfg]
skip_sections:
  mcu EBBCan
  resonance_tester
  input_shaper
  shaketune
#overrides:
# Optional manual dock fallback (normally not needed — VORTAC_DETECT
# establishes docks at runtime):
#  vortac_tool TN.home_dock: dock0
# GCode offsets (printer-frame coordinates -> nozzle position):
#  vortac_tool TN.gcode_offset_x: 0.0
#  vortac_tool TN.gcode_offset_y: 0.0
#  vortac_tool TN.gcode_offset_z: 0.0
# Gcode hooks run by the manager around tool changes. RECOMMENDED — wire
# these two up on every tool. tool_deactivate_gcode runs as the FIRST step
# of a change (old tool still the active extruder, offsets still applied,
# toolhead still at the print position), tool_activate_gcode as the LAST
# (new tool active, offsets applied, mesh restored). macros.example.cfg
# implements both: extra retract + standby temperature on parking, back to
# print temperature + WAIT + undo the retract on pickup. Without the pick
# hook nothing waits for a parked tool to reheat and the slicer's first
# extrusion after a change can hit a cold nozzle.
# `overrides` takes ONE LINE per entry, which is why the logic sits in a
# macro rather than inline here.
#  vortac_tool TN.tool_deactivate_gcode: _VORTAC_TOOL_PARK EXTRUDER={tool.extruder_name} IDX={tool.tool_index}
#  vortac_tool TN.tool_activate_gcode: _VORTAC_TOOL_PICK EXTRUDER={tool.extruder_name} IDX={tool.tool_index}
# Hardware deviations — values may use template-relative pin names
# (EBBCan: ...); keys absent from the template are added, an empty value
# deletes the option. Example — PT1000 on the onboard MAX31865 instead of
# the template thermistor:
#  extruder.sensor_type: MAX31865
#  extruder.sensor_pin: EBBCan: PA4
#  extruder.spi_bus: spi1
#  extruder.rtd_nominal_r: 1000
#  extruder.rtd_reference_r: 4300
#  extruder.rtd_num_of_wires: 2
#  extruder.rtd_use_50Hz_filter: True

# Dock positions are calibrated at runtime (VORTAC_SELECT_DOCK +
# VORTAC_DOCK_CAL_SAVE, then SAVE_CONFIG) and persisted automatically into
# printer.cfg's autosave block as params_<dock>_x/y/z on
# [vortac_tool myTool] — nothing to write here.
#
# LEGACY / static alternative: a hand-written [vortac_tool T0] section
# (trailing number derives tool_index=0, mcu_name=tool0, home_dock=dock0)
# still works if the shared template does not carry a [vortac_tool TN]
# placeholder — then dock_sense_pin/grab_sense_pin go into that section
# directly.
