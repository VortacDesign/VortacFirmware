# printer.example.cfg — template for your printer.cfg.
#
# Klipper only loads files referenced via [include] from printer.cfg, so this
# .example file is never read by Klipper. Copy it to
# ~/printer_data/config/printer.cfg on the Pi and adjust it there. printer.cfg
# is gitignored — your local copy stays out of the repo.
#
# Boot order matters: the mainboard first, then the grabber MCU, then the tool
# registry (each tool file declares its [mcu toolN] statically before the
# include_with template runs).

[include vortac_configs/mcu/octopus.cfg]   # mainboard: XY, Z×4, bed, dock LEDs, [printer]
[include vortac_configs/mcu/vortac.cfg]    # grabber MCU + [vortac_grabber] + [vortac_qgl_state]
[include vortac_configs/tools.cfg]         # per-tool includes + [vortac_manager]

# Mainsail's client config (virtual_sdcard, PAUSE/RESUME/CANCEL_PRINT,
# display_status). Without it Mainsail warns "... is not defined in config".
# Ships with MainsailOS; otherwise install via the mainsail-config repo
# (see DOCS troubleshooting). The PAUSE park position is tunable via
# [gcode_macro _CLIENT_VARIABLE] if the default corner collides with a dock.
[include mainsail.cfg]

# Your own macros and other includes go below.

# Klipper appends the SAVE_CONFIG block at the end of this file.
