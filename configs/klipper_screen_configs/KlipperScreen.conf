# KlipperScreen.conf — Vortac touchscreen config.
#
# NOTE: KlipperScreen's config validator also scans COMMENT lines for
# square brackets and errors out on them ("Section headers have extra
# information after brackets"). Never write bracketed section names in
# comments in this file.
#
# Deploy by copy or symlink (install.sh does NOT deploy this file):
#     ln -sf ~/vortac/configs/klipper_screen_configs/KlipperScreen.conf \
#            ~/printer_data/config/KlipperScreen.conf
# then:  sudo systemctl restart KlipperScreen
#
# The "menu __main vortac" entry below opens the custom vortac_docks
# panel (klipperscreen/panels/vortac_docks.py, symlinked into
# ~/KlipperScreen/panels/ by install.sh). KlipperScreen's title bar
# provides the back arrow to return to the main menu.

[menu __main vortac]
name: Vortac
icon: extrude
panel: vortac_docks
enable: {{ 'vortac_manager' in printer.config_sections }}

#~# --- Do not edit below this line. This section is auto generated --- #~#
#~#
#~# [main]
#~# move_speed_xy = 500
#~# move_speed_z = 50
#~#
